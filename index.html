<!DOCTYPE html>
<html lang="ja">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>personal diary</title>
        <link rel="stylesheet" href="diary.css">
        <script src="diary.js" defer></script> </head>
  </head>

  <body>
    <h1>
        "まっちー"の 思い出の記録
    </h1>
    <div class = "registration-box">
      <div class="input-forms">
        <form id="memoryForm" class="card">
          <div class="form-section date-upload">
            <label for="dateOfPicture">写真の日付 : </label>
            <input type="date" id="dateOfPicture">
            <label for="memoryOfPicture">載せたい写真を選んでください : </label>
            <input type="file" id="memoryOfPicture" accept="image/*">
          </div>
          <div class="form-section title-memo">
            <label for="sub-title">題名 : </label>
            <input type="text" id="sub-title">
            <label for="memories">登録内容 : </label>
            <textarea id="memories" rows="5" cols="80"></textarea>
          </div>
        </form>
      </div>
      <div class="registration-button-area">
        <input id="registration-button" type="button" value="　登録　" >
      </div>
    </div>
    <div id="display-area"></div>
  </body>
  </html>
